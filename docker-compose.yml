services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME}
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - pelabuhan-cuaca-network

  webserver:
    image: nginx:alpine3.24
    container_name: ${WEBSERVER_CONTAINER_NAME}
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pelabuhan-cuaca-network

  db:
    image: mysql:8.2
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pelabuhan-cuaca-network

  adminer:
    image: adminer:6.0.1
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - "8081:8080"
    networks:
      - pelabuhan-cuaca-network

networks:
  pelabuhan-cuaca-network:
    driver: bridge

volumes:
  dbdata:
